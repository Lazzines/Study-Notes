    function showSearch(query){const q=query.trim().toLocaleLowerCase('ru');const results=allLessons.filter(x=>`${x.subject.title} ${x.title}`.toLocaleLowerCase('ru').includes(q)).slice(0,14);$('#searchResults').innerHTML=`<div class="modal-label">${q?'Результаты поиска':'Все лекции'} · ${results.length}</div>${results.length?results.map(x=>`<a class="modal-item" href="#/${isReady(x.subject,x.index)?`read/${x.subject.id}/${x.index}`:`subject/${x.subject.id}`}"><span class="square-icon ${x.subject.tone==='mint'?'mint':''}">${htmlEscape(x.subject.symbol)}</span><span style="flex:1"><strong>${htmlEscape(x.title)}</strong><span>${htmlEscape(x.subject.title)} · ${isReady(x.subject,x.index)?'Открыть PDF':'Пока не загружена'}</span></span><span style="color:var(--accent)">${ico('arrow',16)}</span></a>`).join(''):'<div class="no-results">Ничего не найдено. Попробуй другое слово.</div>'}`}
    $('#searchResults').addEventListener('click',e=>{if(e.target.closest('a'))closeSearch()});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen?closeSearch():openSearch();return}if(e.key==='Escape'&&searchOpen){closeSearch();return}const tag=document.activeElement?.tagName;if(!searchOpen&&tag!=='INPUT'&&tag!=='TEXTAREA'){if(e.key==='/'&&route().type!=='read'){e.preventDefault();openSearch()}else if(route().type==='read'&&e.key==='ArrowLeft')pageTurn(-1);else if(route().type==='read'&&e.key==='ArrowRight')pageTurn(1)}});
    window.addEventListener('hashchange',render);
    let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(route().type==='read'&&pdfDocument)drawPage()},180)});
    // Проверяем наличие файлов. Это позволяет загружать новые PDF без правки кода сайта.
    async function checkFiles(){if(location.protocol==='file:')return;const checks=allLessons.map(async ({subject,index})=>{const path=localPath(subject,index);try{const response=await fetch(lessonUrl(subject,index),{method:'HEAD',cache:'no-store'});availability.set(path,response.ok)}catch{/* офлайн — сохраняем предыдущие значения */}});await Promise.all(checks);const r=route();if(r.type==='home')home();else if(r.type==='semester'&&r.number===3)semester(3);else if(r.type==='subject')subject(r.id);if(searchOpen)showSearch($('#globalSearch').value)}
    render();checkFiles();
  </script>
</body>
</html>
