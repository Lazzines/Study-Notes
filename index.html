<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Study Notes — университетские лекции и рукописные конспекты по семестрам.">
  <title>Study Notes — конспекты по семестрам</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {color-scheme:light;--page:#f7f8fc;--white:#fff;--text:#172038;--muted:#6f7b91;--border:#e5e8f0;--blue:#4b63ec;--blue-dark:#354ddd;--blue-light:#eef0ff;--shadow:0 16px 55px rgba(24,41,87,.055)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}a:focus-visible,button:focus-visible{outline:3px solid #8fa0ff;outline-offset:3px}svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .top{background:rgba(255,255,255,.93);border-bottom:1px solid var(--border);height:76px;display:flex;align-items:center;position:relative;z-index:10}.top-inner{width:min(1140px,calc(100% - 48px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.7px}.brand-icon{width:39px;height:39px;display:grid;place-items:center;background:var(--blue);color:white;border-radius:12px;box-shadow:0 5px 13px #4b63ec33}.brand-icon svg{width:21px;height:21px}.top-link{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.top-link:hover{color:var(--blue)}.top-link svg{width:17px;height:17px}
    .layout{max-width:1140px;margin:0 auto;padding:61px 24px 100px}.intro{margin-bottom:35px}.eyebrow{color:var(--blue);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1.55px}.intro h1{font-size:clamp(34px,5vw,53px);line-height:1.16;font-weight:800;letter-spacing:-2.4px;margin:13px 0 13px}.intro p{color:var(--muted);font-size:14px;line-height:1.85;margin:0;max-width:600px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:19px}.heading h2{font-size:18px;font-weight:800;letter-spacing:-.5px;margin:0}.heading .small{font-size:12px;color:var(--muted)}
    .course{margin-top:36px}.course:first-child{margin-top:0}.course-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.course-index{height:33px;width:33px;background:var(--blue-light);border-radius:10px;color:var(--blue);font-size:12px;font-weight:800;display:grid;place-items:center}.course-title{font-size:15px;font-weight:800;letter-spacing:-.25px}.course-year{font-size:11px;color:var(--muted);margin-top:2px}
    .semester-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.sem{border:1px solid var(--border);background:var(--white);border-radius:18px;padding:24px 25px;display:flex;align-items:center;gap:18px;min-height:128px;transition:.18s;box-shadow:0 1px 1px #0a143608}.sem:hover{border-color:#bfc8fc;transform:translateY(-2px);box-shadow:var(--shadow)}.sem.available{border-color:#dadfff;background:linear-gradient(115deg,#fff 10%,#f5f5ff 100%)}.sem-figure{font-size:37px;font-weight:800;letter-spacing:-1.8px;color:#bdc2cf;min-width:44px}.sem.available .sem-figure{color:var(--blue)}.sem-copy{flex:1;min-width:0}.sem-copy strong{display:block;font-size:15px;font-weight:800;margin-bottom:6px}.sem-copy span{color:var(--muted);font-size:11px;line-height:1.65}.sem-arrow{width:33px;height:33px;border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;color:#8792a7}.sem-arrow svg{width:16px;height:16px}.sem.available .sem-arrow{background:#e9edff;border-color:transparent;color:var(--blue)}
    .crumbs{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:28px;font-size:12px;font-weight:700;color:#7b879a}.crumbs a:hover{color:var(--blue)}.crumbs .active{color:#303d5d}.crumbs svg{width:13px;height:13px;opacity:.55}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.subject{display:flex;align-items:center;gap:18px;min-height:130px;padding:25px;background:var(--white);border:1px solid var(--border);border-radius:18px;transition:.18s}.subject:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bec7ff}.subject-icon{width:59px;height:59px;display:grid;place-items:center;flex:none;background:#eceaff;border-radius:16px;color:#6354c6;font-size:17px;font-weight:800}.subject-icon.db{background:#e6f5f0;color:#218969}.subject-main{flex:1}.subject-main strong{display:block;font-size:18px;font-weight:800;letter-spacing:-.5px}.subject-main span{display:block;color:var(--muted);font-size:12px;margin-top:7px}.subject > svg{width:18px;height:18px;color:#9da6b7}
    .empty{border:1px dashed #d3d9e7;border-radius:18px;background:var(--white);padding:45px;text-align:center;color:var(--muted);line-height:1.7}.empty strong{color:var(--text);display:block;font-size:16px;margin-bottom:8px}.empty svg{width:30px;height:30px;display:block;margin:0 auto 14px;color:#a9b2c3}
    .lecture-list{display:flex;flex-direction:column;gap:10px}.lecture{display:flex;align-items:center;gap:17px;padding:17px 21px;background:var(--white);border:1px solid var(--border);border-radius:14px;min-height:81px;transition:.18s}.lecture.is-ready:hover{border-color:#bbc6ff;box-shadow:var(--shadow);transform:translateY(-1px)}.lecture.is-missing{opacity:.62;cursor:default}.lecture-num{width:44px;height:44px;background:#f2f4fb;display:grid;place-items:center;border-radius:12px;font-weight:800;color:#8a96b0;flex:none}.lecture.is-ready .lecture-num{background:var(--blue-light);color:var(--blue)}.lecture-body{flex:1;min-width:0}.lecture-body strong{display:block;font-weight:800;font-size:13px;line-height:1.6}.lecture-body small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.lecture-end{color:var(--blue);font-weight:800;font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:10px}.lecture-end svg{width:15px;height:15px}.lecture.is-missing .lecture-end{color:var(--muted)}
    .reader-view{min-height:calc(100dvh - 76px);padding:16px clamp(12px,2.6vw,38px) 24px;max-width:none}.reader-crumbs{max-width:1600px;margin:0 auto 12px}.reader-heading{max-width:1600px;margin:0 auto 13px;display:flex;align-items:center;justify-content:space-between;gap:15px}.reader-heading h1{font-size:clamp(15px,1.5vw,20px);margin:0;font-weight:800;letter-spacing:-.4px;line-height:1.4}.reader-heading p{font-size:11px;color:var(--muted);margin:4px 0 0}.pdf-shell{width:100%;max-width:1600px;margin:0 auto;border:1px solid #dce1ec;border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 16px 38px #13224410}.pdf-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 15px;border-bottom:1px solid #e9edf3;background:#fff}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.control{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:36px;height:36px;border-radius:9px;background:#f5f6fa;border:1px solid #e8ebf1;color:var(--text);padding:0 11px;font-size:11px;font-weight:800}.control:hover:not(:disabled){background:#ebeeff;color:var(--blue)}.control svg{width:16px;height:16px}.control.selected{background:var(--blue-light);color:var(--blue);border-color:#d6dcff}.pages{font-size:12px;font-weight:800;color:#5b667c;min-width:69px;text-align:center;font-variant-numeric:tabular-nums}.pdf-stage{height:calc(100dvh - 236px);min-height:490px;max-height:1400px;overflow:auto;background:#e8ebf1;padding:24px 18px;scrollbar-color:#a5adbc transparent;display:block;text-align:center}.pdf-stage canvas{display:block;margin:0 auto;background:#fff;box-shadow:0 10px 32px #25314b22;max-width:none}.pdf-placeholder{min-height:390px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#6c778c;line-height:1.7;padding:30px}.pdf-placeholder strong{font-size:15px;color:#27334b}.pdf-placeholder svg{width:30px;height:30px;color:#8695b0}.reader-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.text-link{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--blue)}.text-link svg{width:16px;height:16px}.text-link:hover{text-decoration:underline}
    .pdf-shell:fullscreen{max-width:none;border:0;border-radius:0;width:100%;height:100dvh;display:flex;flex-direction:column;background:#fff}.pdf-shell:fullscreen .pdf-stage{flex:1;min-height:0;max-height:none;height:auto}.pdf-shell:fullscreen .pdf-toolbar{flex:none}
    .bottom{margin-top:48px;color:#98a1b0;font-size:11px;text-align:center}.bottom a:hover{color:var(--blue)}
    @media(max-width:800px){.layout{padding-top:40px}.intro h1{letter-spacing:-1.6px}.pdf-toolbar{gap:9px}.pdf-stage{height:calc(100dvh - 270px)}.reader-view{padding:14px 12px 20px}}
    @media(max-width:610px){.top{height:65px}.top-inner{width:calc(100% - 32px)}.top-link span{display:none}.layout{padding:35px 16px 65px}.intro{margin-bottom:26px}.intro h1{font-size:33px;letter-spacing:-1.5px}.intro p{font-size:12px}.semester-grid,.cards{grid-template-columns:1fr;gap:11px}.course{margin-top:29px}.sem{padding:18px;min-height:102px}.sem-figure{font-size:29px;min-width:37px}.subject{padding:19px;min-height:105px}.subject-icon{width:49px;height:49px;font-size:14px}.subject-main strong{font-size:16px}.lecture{padding:13px 12px;gap:10px}.lecture-num{width:37px;height:39px}.lecture-end{font-size:10px}.reader-crumbs{margin-bottom:10px}.reader-heading{margin-bottom:12px}.reader-heading p{display:none}.reader-view{min-height:calc(100dvh - 65px)}.pdf-stage{height:calc(100dvh - 238px);min-height:390px;padding:12px 8px}.pdf-toolbar{padding:9px 8px}.tools{gap:4px}.control{padding:0 7px;min-width:32px;height:34px;font-size:10px}.control span.hide-on-phone{display:none}.pages{min-width:57px;font-size:11px}.reader-actions{gap:8px}.reader-actions .text-link{font-size:10px}.pdf-shell{border-radius:11px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

    /* Надёжный полноразмерный просмотр PDF в браузере */
    .pdf-stage.native-viewer{padding:0!important;overflow:hidden;height:calc(100dvh - 190px);min-height:650px;max-height:none;text-align:left;background:#edf0f6}
    .pdf-stage.native-viewer iframe{width:100%;height:100%;border:0;display:block;background:#fff}
    .pdf-stage.native-viewer .pdf-placeholder{min-height:100%;text-align:center}
    .reader-simple-label{font-size:12px;font-weight:700;color:#5b667c}
    .pdf-stage .error-path{font-size:12px;overflow-wrap:anywhere;max-width:750px;background:#fff;border-radius:8px;padding:9px 12px;color:#54627e}
    .pdf-stage .error-help{font-size:12px;color:#53657e;max-width:540px;line-height:1.6;text-align:center}
    @media(max-width:610px){.pdf-stage.native-viewer{height:calc(100dvh - 175px);min-height:480px}}

    /* Full-height reader: fit a portrait sheet without clipping the bottom. */
    body.is-reading .top{height:56px}
    body.is-reading .top-inner{width:calc(100% - 36px);max-width:none}
    body.is-reading .reader-view{height:calc(100vh - 56px);height:calc(100dvh - 56px);min-height:0;display:flex;flex-direction:column;padding:7px 12px 8px}
    body.is-reading .reader-crumbs{max-width:none;margin:0 0 5px;flex:none;font-size:11px;gap:6px}
    body.is-reading .reader-heading{max-width:none;flex:none;margin:0 0 7px;gap:8px}
    body.is-reading .reader-heading h1{font-size:clamp(14px,1.4vw,18px)}
    body.is-reading .reader-heading p{display:none}
    body.is-reading .pdf-shell{width:100%;max-width:none;min-height:0;flex:1;display:flex;flex-direction:column;border-radius:11px}
    body.is-reading .pdf-toolbar{flex:none;padding:7px 12px;gap:7px}
    body.is-reading .pdf-stage,body.is-reading .pdf-stage.native-viewer{flex:1;height:auto;min-height:0;max-height:none;padding:0;overflow:auto}
    body.is-reading .pdf-stage:not(.native-viewer){padding:12px}
    body.is-reading .pdf-stage.native-viewer iframe{height:100%;width:100%;display:block}
    body.is-reading .pdf-shell:fullscreen{width:100%;height:100dvh;max-width:none;border-radius:0}
    body.is-reading .pdf-shell:fullscreen .pdf-stage{flex:1;height:auto;min-height:0}
    #nativeFitTools{display:none}
    #nativeFitTools .control.selected{background:#e8ecff;border-color:#bfc9ff;color:#354ddd}
    @media(max-width:610px){
      body.is-reading .top{height:52px}
      body.is-reading .top-inner{width:calc(100% - 24px)}
      body.is-reading .reader-view{height:calc(100vh - 52px);height:calc(100dvh - 52px);padding:5px 6px 7px}
      body.is-reading .reader-crumbs{margin-bottom:5px;font-size:10px;gap:4px}
      body.is-reading .reader-heading{margin-bottom:5px}
      body.is-reading .reader-heading h1{font-size:14px}
      body.is-reading .pdf-toolbar{padding:6px 7px}
      body.is-reading .pdf-stage:not(.native-viewer){padding:7px}
    }
  </style>
</head>
<body>
  <header class="top"><div class="top-inner">
    <a class="brand" href="#/" aria-label="На главную"><span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 0 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span> Study Notes</a>
    <a class="top-link" href="#/" id="homeLink"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H4V10m5 10v-8h6v8"/></svg><span>Все семестры</span></a>
  </div></header>
  <main id="app" class="layout" aria-live="polite"></main>
  <script type="module">
    // Чтобы добавить предмет или лекцию, измени только этот список.
    // PDF остаются в прежних папках GitHub, переносить их не нужно.
    const subjects = [
      {id:'csharp',semester:3,title:'C#',symbol:'C#',root:'semesters/semester-03/CSharp/lectures/',type:'Презентации',lessons:[
        ['Основы объектно-ориентированного программирования','1-oop-basics-presentation.pdf'],
        ['Принципы SOLID и GRASP','2-solid-grasp-presentation.pdf'],
        ['Структурные паттерны проектирования','3-structural-patterns-presentation.pdf'],
        ['Порождающие паттерны проектирования','4-creational-patterns.pdf']
      ]},
      {id:'databases',semester:3,title:'Базы данных',symbol:'DB',root:'semesters/semester-03/Databases/',type:'Лекции',lessons:[
        ['Введение','01-introduction.pdf'],
        ['Модели данных','02-data-models.pdf'],
        ['Атрибуты и ключи','03-attributes-keys.pdf'],
        ['Реляционная модель','04-relational-model.pdf'],
        ['Нормализация','05-normalization.pdf'],
        ['Индексы','06-indexes.pdf'],
        ['Транзакции','07-transactions.pdf'],
        ['Таблицы','08-tables.pdf']
      ]}
    ];
    const app=document.getElementById('app');
    const icons={
      right:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
      chevron:'<path d="m9 18 6-6-6-6"/>',
      left:'<path d="m19 12-7-7-7 7m14 0-7 7-7-7" transform="rotate(-90 12 12)"/>',
      file:'<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M13 2v7h7M8 14h8m-8 4h6"/>',
      fullscreen:'<path d="M8 3H4v4m12-4h4v4M4 17v4h4m12-4v4h-4"/>',
      exit:'<path d="M8 8H4V4m12 4h4V4M4 16h4v4m12-4h-4v4"/>',
      external:'<path d="M13 5h6v6M19 5l-9 9"/><path d="M19 13v6H5V5h6"/>',
      download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',
      book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 0 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>'
    };
    const icon=(name,size=18)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${icons[name]||icons.file}</svg>`;
    const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const getSubject=id=>subjects.find(s=>s.id===id);
    const resolvedFiles=new Map();
    const fileCandidates=(s,i)=>{
      const name=s.lessons[i][1];
      const paths=[s.root+name];
      // Старые инструкции допускали папку lectures внутри Databases.
      if(s.id==='databases')paths.push(s.root+'lectures/'+name);
      return paths.map(path=>new URL(path,location.href.split('#')[0]).href);
    };
    const urlFor=(s,i)=>resolvedFiles.get(lessonKey(s,i))||fileCandidates(s,i)[0];
    async function findFile(s,i){
      const key=lessonKey(s,i);if(resolvedFiles.has(key))return{url:resolvedFiles.get(key),exists:true};
      if(location.protocol==='file:')return{url:fileCandidates(s,i)[0],exists:null};
      let uncertain=false;
      for(const url of fileCandidates(s,i)){
        try{const response=await fetch(url,{method:'HEAD',cache:'no-store'});
          if(response.ok){resolvedFiles.set(key,url);return{url,exists:true}}
          if(response.status!==404)uncertain=true;
        }catch(e){uncertain=true}
      }
      return {url:fileCandidates(s,i)[0],exists:uncertain?null:false};
    }
    const hash=()=>decodeURIComponent(location.hash||'#/');
    const locations=new Map();
    const lessonKey=(s,i)=>`${s.id}/${i}`;
    function route(){let m=hash().match(/^#\/semester\/(\d+)$/);if(m)return {type:'semester',number:+m[1]};m=hash().match(/^#\/subject\/([a-z]+)$/);if(m)return{type:'subject',id:m[1]};m=hash().match(/^#\/view\/([a-z]+)\/(\d+)$/);if(m)return{type:'view',id:m[1],index:+m[2]};return{type:'home'}}
    function bread(parts){return `<nav class="crumbs" aria-label="Навигация">${parts.map((p,i)=>(i?icon('chevron',13):'')+(p.href?`<a href="${p.href}">${escapeHTML(p.label)}</a>`:`<span class="active">${escapeHTML(p.label)}</span>`)).join('')}</nav>`}
    const footer=()=>'<footer class="bottom">Study Notes · Коллекция учебных материалов</footer>';
    function home(){document.title='Study Notes — семестры';app.className='layout';app.innerHTML=`<div class="intro"><span class="eyebrow">Моя библиотека</span><h1>Выбери семестр</h1><p>Все учебные материалы собраны по семестрам. Открой нужный семестр, выбери предмет и переходи к лекциям.</p></div>${[1,2,3,4].map(y=>`<section class="course"><div class="course-head"><span class="course-index">${y}</span><div><div class="course-title">${y} курс</div><div class="course-year">${y*2-1} и ${y*2} семестры</div></div></div><div class="semester-grid">${[y*2-1,y*2].map(n=>{let count=subjects.filter(s=>s.semester===n).length;return `<a href="#/semester/${n}" class="sem ${count?'available':''}"><span class="sem-figure">${String(n).padStart(2,'0')}</span><div class="sem-copy"><strong>${n} семестр</strong><span>${count?`${count} предмета · ${n%2?'Осень':'Весна'}`:`${n%2?'Осень':'Весна'} · Пока нет материалов`}</span></div><span class="sem-arrow">${icon('right',17)}</span></a>`}).join('')}</div></section>`).join('')}${footer()}`}
    function semester(n){if(n<1||n>8){location.hash='#/';return}document.title=`${n} семестр — Study Notes`;app.className='layout';const ss=subjects.filter(s=>s.semester===n);app.innerHTML=`${bread([{href:'#/',label:'Все семестры'},{label:`${n} семестр`}])}<section class="intro"><span class="eyebrow">${Math.ceil(n/2)} курс</span><h1>${n} семестр</h1><p>Выбери предмет, чтобы посмотреть лекции и презентации.</p></section>${ss.length?`<div class="heading"><h2>Предметы</h2><span class="small">${ss.length} шт.</span></div><div class="cards">${ss.map(s=>`<a class="subject" href="#/subject/${s.id}"><span class="subject-icon ${s.id==='databases'?'db':''}">${escapeHTML(s.symbol)}</span><span class="subject-main"><strong>${escapeHTML(s.title)}</strong><span>${escapeHTML(s.type)} · ${s.lessons.length} тем</span></span>${icon('right',18)}</a>`).join('')}</div>`:`<div class="empty">${icon('book',30)}<strong>Предметов пока нет</strong>Когда ты добавишь материалы этого семестра, они появятся здесь.</div>`}${footer()}`}
    function status(s,i){return locations.get(lessonKey(s,i))||'checking'}
    function subject(id){const s=getSubject(id);if(!s){location.hash='#/';return}document.title=`${s.title} — Study Notes`;app.className='layout';app.innerHTML=`${bread([{href:'#/',label:'Все семестры'},{href:`#/semester/${s.semester}`,label:`${s.semester} семестр`},{label:s.title}])}<section class="intro"><span class="eyebrow">${s.semester} семестр · ${escapeHTML(s.type)}</span><h1>${escapeHTML(s.title)}</h1><p>Выбери лекцию, чтобы открыть PDF в большом просмотрщике.</p></section><div class="heading"><h2>${escapeHTML(s.type)}</h2><span class="small">${s.lessons.length} материалов</span></div><div class="lecture-list">${s.lessons.map((lesson,i)=>{const stat=status(s,i),missing=stat==='missing';return `<${missing?'div':'a'} ${missing?'':`href="#/view/${s.id}/${i}"`} class="lecture ${missing?'is-missing':'is-ready'}"><span class="lecture-num">${String(i+1).padStart(2,'0')}</span><span class="lecture-body"><strong>${escapeHTML(lesson[0])}</strong><small>PDF · Материал №${i+1}</small></span><span class="lecture-end">${missing?'Ещё не загружено':stat==='checking'?'Проверяем…':stat==='unknown'?'Открыть':'Читать'}${missing?'':icon('right',15)}</span></${missing?'div':'a'}>`}).join('')}</div>${footer()}`}
    // PDF.js обеспечивает собственное управление масштабом. Если он недоступен,
    // используем нативный PDF-просмотрщик Chrome/Firefox/Edge на всю ширину окна.
    const pdfjsUrl='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs';
    const pdfWorkerUrl='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';
    let pdfjsLib=null,doc=null,task=null,renderTask=null,renderToken=0,session=0,pdfPage=1,zoom=1,fitMode='page';
    function cleanup(){session++;renderToken++;if(renderTask){try{renderTask.cancel()}catch{}renderTask=null}const old=task;task=null;doc=null;if(old)old.destroy().catch(()=>{})}
    function view(id,index){
      const s=getSubject(id);if(!s||!s.lessons[index]){location.hash='#/';return}
      document.title=`${s.lessons[index][0]} — Study Notes`;app.className='reader-view';document.body.classList.add('is-reading');
      const pdf=urlFor(s,index);
      app.innerHTML=`${bread([{href:'#/',label:'Семестры'},{href:`#/semester/${s.semester}`,label:`${s.semester} семестр`},{href:`#/subject/${id}`,label:s.title},{label:s.lessons[index][0]}])}<div class="reader-heading"><div><h1>${escapeHTML(s.lessons[index][0])}</h1><p>${escapeHTML(s.title)} · ${escapeHTML(s.type)} · PDF</p></div><div class="reader-actions"><a id="openOriginal" href="${escapeHTML(pdf)}" class="text-link" target="_blank" rel="noopener noreferrer">${icon('external',16)}<span>Открыть PDF</span></a><a id="downloadOriginal" href="${escapeHTML(pdf)}" class="text-link" download>${icon('download',16)}<span>Скачать</span></a></div></div><section class="pdf-shell" id="pdfShell" aria-label="Просмотр PDF"><div class="pdf-toolbar"><div class="tools" id="nativeFitTools"><button class="control" id="nativeFitPage" type="button">Вся страница</button><button class="control" id="nativeFitWidth" type="button">По ширине</button></div><div class="tools" id="pdfNavigation"><button class="control" id="prev" title="Предыдущая страница" aria-label="Предыдущая страница">←</button><span class="pages" id="pageLabel">— / —</span><button class="control" id="next" title="Следующая страница" aria-label="Следующая страница">→</button></div><div class="tools"><span id="nativeHint" class="reader-simple-label" style="display:none">Управление страницами и масштабом — в панели PDF</span><div id="pdfScaleTools" class="tools"><button class="control" id="fitWidth">По ширине</button><button class="control" id="fitPage">Вся страница</button><button class="control" id="zoomOut" title="Уменьшить" aria-label="Уменьшить">−</button><span class="pages" id="zoomLabel">100%</span><button class="control" id="zoomIn" title="Увеличить" aria-label="Увеличить">+</button></div><button class="control" id="full" title="На весь экран">${icon('fullscreen',16)} <span class="hide-on-phone">На весь экран</span></button></div></div><div class="pdf-stage" id="stage"><div class="pdf-placeholder" id="pdfPlaceholder">${icon('file',30)}<strong>Загружаем конспект…</strong><span>Страница появится здесь</span></div></div></section>`;
      fitMode='page';zoom=1;pdfPage=1;
      for(const [el,fn] of [['prev',()=>turn(-1)],['next',()=>turn(1)],['zoomIn',()=>changeZoom(.2)],['zoomOut',()=>changeZoom(-.2)],['fitWidth',()=>setFit('width')],['fitPage',()=>setFit('page')],['full',toggleFull],['nativeFitPage',()=>setNativeFit('page')],['nativeFitWidth',()=>setNativeFit('width')]])document.getElementById(el).addEventListener('click',fn);
      const current=++session;loadPdf(s,index,current);
    }
    function setFileLinks(url){
      const open=document.getElementById('openOriginal'),download=document.getElementById('downloadOriginal');
      if(open)open.href=url;if(download)download.href=url;
    }
    function showMissingFile(s,index,url){
      const stage=document.getElementById('stage');if(!stage)return;
      stage.classList.add('native-viewer');
      document.getElementById('pdfNavigation').style.display='none';
      document.getElementById('pdfScaleTools').style.display='none';
      const relative=new URL(url).pathname.replace(/^\/Study-Notes\//,'');
      stage.innerHTML=`<div class="pdf-placeholder">${icon('file',30)}<strong>Файл лекции не найден</strong><span class="error-help">Сайт работает, но по ожидаемому адресу PDF отсутствует. Проверь, что название и папка на GitHub совпадают со ссылкой.</span><code class="error-path">${escapeHTML(relative)}</code><a class="text-link" href="https://github.com/Lazzines/Study-Notes/tree/main/semesters/semester-03/${escapeHTML(s.id==='csharp'?'CSharp':'Databases')}" target="_blank" rel="noopener noreferrer">Проверить файлы на GitHub</a></div>`;
    }
    let nativeUrl='';
    let nativeMode='page';
    function nativePdfLocation(url,mode){
      // Chrome/Edge's PDF viewer: Fit = whole portrait page, FitH = page width.
      // Firefox and other built-in viewers may expose equivalent controls themselves.
      return url.split('#')[0] + '#toolbar=1&navpanes=0&view=' + (mode==='page'?'Fit':'FitH');
    }
    function updateNativeFitButtons(){
      const pg=document.getElementById('nativeFitPage'), wd=document.getElementById('nativeFitWidth');
      if(pg)pg.classList.toggle('selected',nativeMode==='page');
      if(wd)wd.classList.toggle('selected',nativeMode==='width');
      if(pg)pg.setAttribute('aria-pressed',String(nativeMode==='page'));
      if(wd)wd.setAttribute('aria-pressed',String(nativeMode==='width'));
    }
    function setNativeFit(mode){
      if(!nativeUrl)return;
      nativeMode=mode;
      updateNativeFitButtons();
      const frame=document.querySelector('#stage iframe');
      if(frame){
        // Setting src changes the native PDF view mode on page and fullscreen.
        frame.src=nativePdfLocation(nativeUrl,nativeMode);
      }
    }
    function useBrowserPdf(url){
      const stage=document.getElementById('stage');if(!stage)return;
      stage.classList.add('native-viewer');
      document.getElementById('pdfNavigation').style.display='none';
      document.getElementById('pdfScaleTools').style.display='none';
      document.getElementById('nativeHint').style.display='none';
      document.getElementById('nativeFitTools').style.display='flex';
      nativeUrl=url;nativeMode='page';updateNativeFitButtons();
      const iframe=document.createElement('iframe');
      iframe.title='Просмотр PDF — вертикальная страница целиком';
      iframe.setAttribute('allowfullscreen','');
      iframe.src=nativePdfLocation(url,nativeMode);
      stage.replaceChildren(iframe);
    }
    async function loadPdf(s,index,current){
      const found=await findFile(s,index);
      if(current!==session)return;
      setFileLinks(found.url);
      if(found.exists===false){showMissingFile(s,index,found.url);return}
      try{
        if(!pdfjsLib){pdfjsLib=await import(pdfjsUrl);pdfjsLib.GlobalWorkerOptions.workerSrc=pdfWorkerUrl}
        if(current!==session)return;
        task=pdfjsLib.getDocument({url:found.url});
        const pdf=await task.promise;
        if(current!==session){try{await pdf.destroy()}catch{}return}
        doc=pdf;drawPage();
      }catch(error){
        console.error('PDF.js loading failed; switching to browser PDF viewer',error);
        if(current!==session)return;
        useBrowserPdf(found.url);
      }
    }
    function setFit(mode){fitMode=mode;zoom=1;drawPage()}
    function changeZoom(delta){zoom=Math.max(.4,Math.min(3,Math.round((zoom+delta)*100)/100));drawPage()}
    function turn(d){if(!doc)return;pdfPage=Math.max(1,Math.min(doc.numPages,pdfPage+d));const stage=document.getElementById('stage');if(stage){stage.scrollTop=0;stage.scrollLeft=0}drawPage()}
    async function drawPage(){if(!doc)return;const stage=document.getElementById('stage');if(!stage)return;const token=++renderToken;if(renderTask){try{renderTask.cancel()}catch{}renderTask=null}try{const page=await doc.getPage(pdfPage);if(token!==renderToken)return;const native=page.getViewport({scale:1});const padding=stage.classList.contains('native-viewer')?0:24;const availW=Math.max(100,stage.clientWidth-padding),availH=Math.max(120,stage.clientHeight-padding);const fitWidth=availW/native.width,fitPage=Math.min(availW/native.width,availH/native.height);const scale=(fitMode==='page'?fitPage:fitWidth)*zoom;const viewport=page.getViewport({scale});const ratio=Math.max(.25,Math.min(window.devicePixelRatio||1,2,Math.sqrt(10000000/(viewport.width*viewport.height))));const canvas=document.createElement('canvas');canvas.style.width=`${Math.round(viewport.width)}px`;canvas.style.height=`${Math.round(viewport.height)}px`;canvas.width=Math.ceil(viewport.width*ratio);canvas.height=Math.ceil(viewport.height*ratio);const ctx=canvas.getContext('2d',{alpha:false});stage.replaceChildren(canvas);document.getElementById('pageLabel').textContent=`${pdfPage} / ${doc.numPages}`;document.getElementById('zoomLabel').textContent=`${Math.round(zoom*100)}%`;document.getElementById('prev').disabled=pdfPage===1;document.getElementById('next').disabled=pdfPage===doc.numPages;document.getElementById('zoomIn').disabled=zoom>=3;document.getElementById('zoomOut').disabled=zoom<=.4;document.getElementById('fitWidth').classList.toggle('selected',fitMode==='width');document.getElementById('fitPage').classList.toggle('selected',fitMode==='page');renderTask=page.render({canvasContext:ctx,viewport,transform:[ratio,0,0,ratio,0,0]});await renderTask.promise}catch(e){if(e?.name!=='RenderingCancelledException'){console.error('Rendering error:',e);if(stage){const s=getSubject(route().id);const index=route().index;if(s&&Number.isInteger(index))useBrowserPdf(urlFor(s,index));}}}}
    async function toggleFull(){const shell=document.getElementById('pdfShell');if(!shell)return;try{if(document.fullscreenElement)await document.exitFullscreen();else await shell.requestFullscreen()}catch(e){console.error('Fullscreen not available',e)}}
    function render(){cleanup();document.body.classList.remove('is-reading');const r=route();if(r.type==='home')home();else if(r.type==='semester')semester(r.number);else if(r.type==='subject')subject(r.id);else if(r.type==='view')view(r.id,r.index);window.scrollTo(0,0)}
    window.addEventListener('hashchange',render);
    let resizeDebounce;window.addEventListener('resize',()=>{clearTimeout(resizeDebounce);resizeDebounce=setTimeout(()=>{if(doc&&route().type==='view')drawPage()},140)});
    document.addEventListener('fullscreenchange',()=>{const full=document.fullscreenElement;const btn=document.getElementById('full');if(btn)btn.innerHTML=full?`${icon('exit',16)} <span class="hide-on-phone">Выйти</span>`:`${icon('fullscreen',16)} <span class="hide-on-phone">На весь экран</span>`;if(doc)setTimeout(drawPage,80)});
    document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(route().type==='view'&&e.key==='ArrowRight'){e.preventDefault();turn(1)}else if(route().type==='view'&&e.key==='ArrowLeft'){e.preventDefault();turn(-1)}});
    // На опубликованном GitHub Pages сайт самостоятельно показывает, какие PDF существуют.
    async function checkFiles(){if(location.protocol==='file:')return;await Promise.all(subjects.flatMap(s=>s.lessons.map(async (_,i)=>{const key=lessonKey(s,i);const found=await findFile(s,i);locations.set(key,found.exists===true?'ready':found.exists===false?'missing':'unknown')})));if(route().type==='subject')subject(route().id)}
    render();checkFiles();
  </script>
