<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Study Notes — лекции и рукописные конспекты по семестрам">
  <title>Study Notes — Библиотека лекций</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1020;
      --panel: #101a2d;
      --panel-2: #16223a;
      --panel-3: #1d2a43;
      --border: #26334a;
      --text: #eff4ff;
      --muted: #98a8c2;
      --accent: #8b91ff;
      --accent-soft: rgba(139,145,255,.15);
      --cyan: #4ed6c6;
      --cyan-soft: rgba(78,214,198,.13);
      --shadow: 0 22px 65px rgba(0,0,0,.15);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f8fd;
      --panel: #fff;
      --panel-2: #f1f4fb;
      --panel-3: #e7ebf6;
      --border: #dfe5f0;
      --text: #18233b;
      --muted: #61718b;
      --accent: #5b5bd6;
      --accent-soft: rgba(91,91,214,.1);
      --cyan: #007f79;
      --cyan-soft: rgba(0,127,121,.09);
      --shadow: 0 16px 45px rgba(46,62,92,.07);
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:15px; line-height:1.5; }
    button,input,a { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .app { min-height:100vh; display:grid; grid-template-columns:270px minmax(0,1fr); }
    .sidebar { background:var(--panel); border-right:1px solid var(--border); padding:27px 19px 20px; display:flex; flex-direction:column; gap:30px; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .brand { display:flex; align-items:center; gap:13px; padding:2px 9px; }
    .brand-logo { display:grid; place-items:center; width:43px; height:43px; border-radius:14px; color:#fff; background:linear-gradient(135deg,#7d83ff,#ab71e4); font-size:23px; font-weight:700; box-shadow:0 8px 24px #6366f13b; }
    .brand-name { font-size:19px; font-weight:800; letter-spacing:-.45px; }
    .brand-sub { font-size:11px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; }
    .nav-label { padding:0 11px; font-size:11px; font-weight:800; letter-spacing:1.35px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
    .nav-items { display:flex; flex-direction:column; gap:5px; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:var(--muted); font-size:13px; border:1px solid transparent; text-align:left; background:transparent; width:100%; transition: .15s ease; }
    .nav-item:hover { color:var(--text); background:var(--panel-2); }
    .nav-item.active { color:var(--text); background:var(--accent-soft); border-color:rgba(139,145,255,.18); font-weight:700; }
    .nav-item .symbol { width:20px; text-align:center; font-size:16px; }
    .nav-item .end { margin-left:auto; opacity:.65; }
    .sidebar-bottom { margin-top:auto; border:1px solid var(--border); border-radius:16px; padding:15px; background:var(--panel-2); }
    .sidebar-bottom b { font-size:13px; }
    .sidebar-bottom p { font-size:12px; color:var(--muted); margin:6px 0 0; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { height:80px; padding:15px clamp(20px,4vw,58px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; justify-content:space-between; }
    .crumb { font-size:13px; font-weight:700; color:var(--muted); }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .search { width:min(320px,34vw); display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:0 12px; height:40px; }
    .search span { color:var(--muted); }
    .search input { background:transparent; border:0; outline:none; color:var(--text); width:100%; font-size:13px; }
    .search input::placeholder { color:var(--muted); }
    .icon-btn { display:grid; place-items:center; height:40px; width:40px; border-radius:12px; background:var(--panel); border:1px solid var(--border); color:var(--text); }
    .icon-btn:hover { background:var(--panel-2); }
    .content { width:100%; max-width:1220px; padding:42px clamp(20px,4vw,58px) 65px; margin:0 auto; }
    .breadcrumbs { color:var(--muted); font-size:13px; display:flex; gap:9px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
    .breadcrumbs a:hover { color:var(--accent); }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:clamp(30px,4vw,47px); letter-spacing:-1.7px; line-height:1.1; margin-bottom:15px; }
    h2 { font-size:21px; letter-spacing:-.55px; margin-bottom:0; }
    h3 { font-size:16px; margin-bottom:8px; }
    .eyebrow { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border:1px solid rgba(139,145,255,.3); color:var(--accent); background:var(--accent-soft); border-radius:99px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:20px; }
    .muted { color:var(--muted); }
    .lead { color:var(--muted); max-width:620px; line-height:1.7; font-size:15px; }
    .hero { overflow:hidden; position:relative; border:1px solid var(--border); background:linear-gradient(130deg,var(--panel),var(--panel-2)); border-radius:25px; padding:clamp(26px,4.5vw,56px); margin-bottom:41px; min-height:270px; box-shadow:var(--shadow); }
    .hero:after { content:""; position:absolute; pointer-events:none; right:-80px; top:-130px; height:380px; width:380px; border-radius:50%; background:radial-gradient(circle,rgba(139,145,255,.2),transparent 65%); }
    .hero h1 { max-width:650px; }
    .hero .lead { position:relative; z-index:1; margin-bottom:25px; }
    .meta { display:flex; gap:11px; flex-wrap:wrap; }
    .meta-chip { border-radius:10px; padding:9px 12px; background:var(--bg); border:1px solid var(--border); color:var(--muted); font-size:12px; }
    .meta-chip b { color:var(--text); }
    .section-header { display:flex; align-items:baseline; justify-content:space-between; gap:15px; margin:30px 0 17px; }
    .section-header .muted { font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    .card { text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:23px; box-shadow:var(--shadow); transition:transform .16s,border-color .16s; min-height:162px; display:flex; flex-direction:column; }
    .card:hover:not(.dimmed) { transform:translateY(-3px); border-color:var(--accent); }
    .card.dimmed { opacity:.55; cursor:default; }
    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:23px; }
    .tile-icon { display:grid; place-items:center; height:43px; width:43px; border-radius:13px; background:var(--accent-soft); color:var(--accent); font-size:21px; }
    .tile-icon.cyan { background:var(--cyan-soft); color:var(--cyan); }
    .tag { border-radius:50px; padding:4px 9px; background:var(--panel-2); color:var(--muted); font-size:11px; font-weight:700; }
    .card h3 { font-size:18px; letter-spacing:-.3px; margin:0 0 5px; }
    .card p { color:var(--muted); font-size:12px; margin:0; }
    .card .card-footer { margin-top:auto; padding-top:20px; color:var(--accent); font-size:12px; font-weight:700; }
    .page-intro { margin-bottom:32px; }
    .page-intro h1 { margin-bottom:12px; }
    .page-intro .lead { margin-bottom:0; }
    .lecture-list { display:flex; flex-direction:column; gap:10px; }
    .lecture { display:flex; gap:16px; align-items:center; border:1px solid var(--border); padding:15px 17px; border-radius:14px; background:var(--panel); text-align:left; width:100%; color:var(--text); transition: .15s; }
    .lecture:hover:not(:disabled) { background:var(--panel-2); border-color:var(--accent); }
    .lecture:disabled { cursor:default; opacity:.62; }
    .lecture-number { font-size:12px; font-weight:800; color:var(--muted); border-radius:11px; background:var(--panel-2); width:43px; height:43px; display:grid; place-items:center; flex-shrink:0; }
    .lecture-title { font-size:14px; font-weight:650; }
    .lecture-sub { font-size:11px; color:var(--muted); margin-top:3px; }
    .lecture-tail { font-size:12px; margin-left:auto; color:var(--accent); white-space:nowrap; font-weight:750; }
    .lecture:disabled .lecture-tail { color:var(--muted); }
    .notice { padding:17px 20px; border:1px solid var(--border); background:var(--panel); border-radius:14px; color:var(--muted); font-size:13px; }
    .ghost-btn, .primary-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 16px; border-radius:11px; border:1px solid var(--border); font-size:12px; font-weight:750; background:var(--panel); color:var(--text); text-decoration:none; }
    .ghost-btn:hover { background:var(--panel-2); }
    .primary-btn { border-color:transparent; background:var(--accent); color:#fff; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .viewer-layout { display:flex; flex-direction:column; gap:16px; }
    .viewer-toolbar { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; background:var(--panel); border:1px solid var(--border); border-radius:15px; padding:12px 16px; }
    .viewer-toolbar .group { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .viewer-toolbar .group .ghost-btn { padding:8px 11px; }
    .viewer-toolbar button:disabled { cursor:not-allowed; opacity:.38; }
    .page-counter { min-width:86px; text-align:center; font-variant-numeric:tabular-nums; font-size:12px; font-weight:750; color:var(--muted); }
    .pdf-stage { height:calc(100vh - 295px); min-height:420px; overflow:auto; border-radius:17px; border:1px solid var(--border); background:#202838; display:flex; align-items:flex-start; justify-content:flex-start; padding:20px; }
    .pdf-center { margin:0 auto; position:relative; }
    .pdf-center canvas { display:block; background:#fff; box-shadow:0 10px 40px #0005; }
    .pdf-loading { padding:40px; text-align:center; color:#cbd5e1; width:100%; }
    .pdf-error { padding:40px; max-width:720px; margin:auto; color:#fff; text-align:center; }
    .pdf-error p { color:#b9c6dc; }
    .page-footer { margin-top:45px; border-top:1px solid var(--border); padding-top:20px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:10px; }
    .empty { margin-top:20px; padding:40px; text-align:center; border:1px dashed var(--border); border-radius:17px; color:var(--muted); }
    .mobile-nav { display:none; }
    @media(max-width:900px) {
      .app { grid-template-columns:1fr; }
      .sidebar { display:none; }
      .mobile-nav { display:flex; gap:6px; padding:11px 18px; overflow-x:auto; border-bottom:1px solid var(--border); }
      .mobile-nav a { font-size:12px; padding:9px 12px; background:var(--panel); border:1px solid var(--border); border-radius:11px; white-space:nowrap; }
      .content { padding:28px 22px 45px; }
      .topbar { padding:12px 20px; height:65px; }
      .pdf-stage { height:calc(100vh - 290px); }
    }
    @media(max-width:520px) {
      .topbar .crumb { font-size:12px; }
      .search { width:48px; padding:0 12px; }
      .search:focus-within { width:min(215px,55vw); }
      .search:not(:focus-within) input { width:0; padding:0; }
      h1 { font-size:30px; }
      .hero { padding:26px; min-height:0; }
      .grid { grid-template-columns:1fr; }
      .card { min-height:140px; }
      .lecture { padding:12px; gap:10px; }
      .lecture-title { font-size:13px; }
      .viewer-toolbar { padding:9px; }
      .viewer-toolbar .group { gap:4px; }
      .viewer-toolbar .group .ghost-btn { padding:7px 9px; }
      .pdf-stage { padding:8px; height:calc(100vh - 275px); min-height:350px; }
      .page-footer { flex-direction:column; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="#/" class="brand" aria-label="Главная Study Notes">
      <span class="brand-logo">✦</span>
      <span><span class="brand-name">Study Notes</span><br><span class="brand-sub">Личная библиотека</span></span>
    </a>
    <nav aria-label="Основное меню">
      <div class="nav-label">Навигация</div>
      <div class="nav-items" id="mainNav"></div>
    </nav>
    <nav aria-label="Семестры">
      <div class="nav-label">Семестры</div>
      <div class="nav-items" id="semesterNav"></div>
    </nav>
    <div class="sidebar-bottom"><b>✍️ Конспекты и лекции</b><p>Все материалы собраны по предметам. PDF можно читать в высоком разрешении прямо на сайте.</p></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="topCrumb">Моя библиотека / Главная</div>
      <div class="top-actions">
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Поиск лекций..." aria-label="Поиск лекций"></label>
        <button class="icon-btn" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">☼</button>
      </div>
    </header>
    <div class="mobile-nav"><a href="#/">⌂ Главная</a><a href="#/semester/3">3 семестр</a><a href="#/subject/csharp">C#</a><a href="#/subject/databases">Базы данных</a></div>
    <main class="content" id="view" aria-live="polite"></main>
  </div>
</div>
<script type="module">
  // Для новой лекции достаточно добавить строку в массив lectures.
  // Имя файла должно в точности совпадать с именем PDF в репозитории.
  const subjects = [
    {
      id: 'csharp', title: 'C#', icon: '⌘', color: 'purple',
      description: 'Объектно-ориентированное программирование и паттерны проектирования',
      root: 'semesters/semester-03/CSharp/',
      lectures: [
        { title: 'Основы объектно-ориентированного программирования', file: 'lectures/1-oop-basics-presentation.pdf' },
        { title: 'Принципы SOLID и GRASP', file: 'lectures/2-solid-grasp-presentation.pdf' },
        { title: 'Структурные паттерны проектирования', file: 'lectures/3-structural-patterns-presentation.pdf' },
        { title: 'Порождающие паттерны проектирования', file: 'lectures/4-creational-patterns.pdf' }
      ]
    },
    {
      id: 'databases', title: 'Базы данных', icon: '▤', color: 'cyan',
      description: 'Модели данных, реляционная теория, индексы и транзакции',
      root: 'semesters/semester-03/Databases/',
      lectures: [
        { title: 'Введение', file: '01-introduction.pdf' },
        { title: 'Модели данных', file: '02-data-models.pdf' },
        { title: 'Атрибуты и ключи', file: '03-attributes-keys.pdf' },
        { title: 'Реляционная модель', file: '04-relational-model.pdf' },
        { title: 'Нормализация', file: '05-normalization.pdf' },
        { title: 'Индексы', file: '06-indexes.pdf' },
        { title: 'Транзакции', file: '07-transactions.pdf' },
        { title: 'Таблицы', file: '08-tables.pdf' }
      ]
    }
  ];

  const view = document.querySelector('#view');
  const mainNav = document.querySelector('#mainNav');
  const semesterNav = document.querySelector('#semesterNav');
  const searchInput = document.querySelector('#searchInput');
  const topCrumb = document.querySelector('#topCrumb');
  const themeToggle = document.querySelector('#themeToggle');
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fullPath = (s, l) => s.root + l.file;
  const fileUrl = (s, l) => new URL(fullPath(s,l), document.baseURI).href;
  let availability = {};
  let doc = null, renderTask = null, viewerRun = 0, viewerZoom = 1, pageNumber = 1, currentSubject = null, currentLecture = null, libPromise = null;
  let searchQuery = '';
  try { if(localStorage.getItem('study-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch(_) {}
  function updateThemeIcon() { themeToggle.textContent = document.documentElement.dataset.theme === 'light' ? '☾' : '☼'; }
  updateThemeIcon();
  themeToggle.addEventListener('click', () => {
    const light = document.documentElement.dataset.theme !== 'light';
    if(light) document.documentElement.dataset.theme='light'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('study-theme', light?'light':'dark'); } catch(_) {}
    updateThemeIcon();
  });
  function route() {
    const hash = decodeURIComponent(location.hash.slice(1) || '/');
    let parts = hash.split('/').filter(Boolean);
    return parts.length === 0 ? { type: 'home' } :
      parts[0] === 'semester' ? {type:'semester', number:Number(parts[1])} :
      parts[0] === 'subject' ? {type:'subject', id:parts[1]} :
      parts[0] === 'pdf' ? {type:'pdf', id:parts[1], index:Number(parts[2])} :
      {type:'home'};
  }
  function breadcrumb(items) {
    return `<div class="breadcrumbs">${items.map((a,i) => a.href ? `<a href="${a.href}">${escapeHtml(a.label)}</a>` : `<span>${escapeHtml(a.label)}</span>`).join('<span>›</span>')}</div>`;
  }
  const footer = () => `<footer class="page-footer"><span>© Study Notes · Библиотека учебных материалов</span><span>Сделано для учёбы ✦</span></footer>`;
  const allLectures = subjects.flatMap(s => s.lectures.map((l,i)=>({subject:s, lecture:l, index:i})));
  const actualCount = (s) => s.lectures.filter(l=>availability[fullPath(s,l)]===true).length;
  const lectureHref = (s,i) => `#/pdf/${s.id}/${i+1}`;
  function lectureRow(s, lecture, i) {
    const status = availability[fullPath(s,lecture)];
    const missing = status === false;
    const num = String(i+1).padStart(2,'0');
    return `<button class="lecture" ${missing?'disabled':''} data-href="${lectureHref(s,i)}" aria-label="Открыть лекцию ${escapeHtml(lecture.title)}">
      <span class="lecture-number">${num}</span>
      <span style="flex:1; min-width:0"><span class="lecture-title">${escapeHtml(lecture.title)}</span><br><span class="lecture-sub">${escapeHtml(s.title)} · PDF</span></span>
      <span class="lecture-tail">${missing?'Ещё не загружено':status===null?'Проверка…':'Читать ↗'}</span>
    </button>`;
  }
  function renderHome() {
    topCrumb.textContent='Моя библиотека / Главная';
    const loaded = allLectures.filter(({subject,lecture})=>availability[fullPath(subject,lecture)]===true).length;
    view.innerHTML=`<section class="hero"><span class="eyebrow">✦ Личная база знаний</span><h1>Все знания.<br>В одном месте.</h1><p class="lead">Лекции, рукописные конспекты и учебные материалы. Выбирай семестр, открывай предмет и читай PDF без лишних переходов.</p><div class="meta"><span class="meta-chip"><b>8</b> семестров</span><span class="meta-chip"><b>2</b> предмета</span><span class="meta-chip"><b>${loaded}</b> загруженных PDF</span></div></section>
    <div class="section-header"><h2>Семестры</h2><span class="muted">4 курса · 8 семестров</span></div><div class="grid">
    ${Array.from({length:8},(_,i)=>{let n=i+1, active=n===3;return `<a class="card ${active?'':'dimmed'}" ${active?'href="#/semester/3"':'aria-disabled="true"'}><div class="card-top"><span class="tile-icon">${n%2?'◈':'✦'}</span><span class="tag">${active?'Есть материалы':'Пусто'}</span></div><h3>${n} семестр</h3><p>${Math.ceil(n/2)} курс · ${n%2?'осень':'весна'}</p><span class="card-footer">${active?'Перейти к предметам →':'Материалы появятся позже'}</span></a>`}).join('')}</div>${footer()}`;
  }
  function renderSemester(number) {
    if(number!==3) { view.innerHTML=breadcrumb([{label:'Главная',href:'#/'},{label:`${number} семестр`}])+`<div class="page-intro"><h1>${number} семестр</h1><p class="lead">Пока здесь нет материалов.</p></div><a href="#/" class="ghost-btn">← На главную</a>`;return; }
    topCrumb.textContent='Моя библиотека / 3 семестр';
    view.innerHTML=`${breadcrumb([{label:'Главная',href:'#/'},{label:'3 семестр'}])}<div class="page-intro"><span class="eyebrow">2 курс · Осенний семестр</span><h1>3 семестр</h1><p class="lead">Выбери дисциплину, чтобы перейти к списку лекций и открыть нужный PDF.</p></div>
    <div class="section-header"><h2>Предметы</h2><span class="muted">${subjects.length} предмета</span></div>
    <div class="grid">${subjects.map(s=>`<a class="card" href="#/subject/${s.id}"><div class="card-top"><span class="tile-icon ${s.color==='cyan'?'cyan':''}">${s.icon}</span><span class="tag">${actualCount(s)} PDF</span></div><h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.description)}</p><span class="card-footer">Смотреть лекции →</span></a>`).join('')}</div>${footer()}`;
  }
  function renderSubject(id) {
    const s=subjects.find(s=>s.id===id);
    if(!s){view.innerHTML=`<h1>Предмет не найден</h1><a href="#/semester/3">← К предметам</a>`;return;}
    topCrumb.textContent=`3 семестр / ${s.title}`;
    view.innerHTML=`${breadcrumb([{label:'Главная',href:'#/'},{label:'3 семестр',href:'#/semester/3'},{label:s.title}])}
    <div class="page-intro"><span class="eyebrow">✦ 3 семестр · Лекции</span><h1>${escapeHtml(s.title)}</h1><p class="lead">${escapeHtml(s.description)}. Нажми на лекцию, чтобы читать её прямо на сайте.</p></div>
    <div class="section-header"><h2>Лекции</h2><span class="muted">Загружено ${actualCount(s)} из ${s.lectures.length}</span></div>
    <div class="lecture-list">${s.lectures.map((l,i)=>lectureRow(s,l,i)).join('')}</div>
    <div style="margin-top:20px" class="notice">Новые лекции появляются автоматически после добавления их PDF в репозиторий, если имя файла уже указано в настройках сайта.</div>${footer()}`;
  }
  function renderSearch() {
    topCrumb.textContent='Моя библиотека / Поиск';
    const q=searchQuery.toLocaleLowerCase('ru');
    const matches=allLectures.filter(({subject,lecture})=>`${subject.title} ${lecture.title}`.toLocaleLowerCase('ru').includes(q));
    view.innerHTML=`${breadcrumb([{label:'Главная',href:'#/'},{label:'Результаты поиска'}])}<div class="page-intro"><span class="eyebrow">⌕ Поиск</span><h1>Результаты поиска</h1><p class="lead">Найдено тем: ${matches.length}</p></div>${matches.length ? `<div class="lecture-list">${matches.map(({subject,lecture,index})=>lectureRow(subject,lecture,index)).join('')}</div>`:'<div class="empty">По этому запросу лекции не найдены</div>'}${footer()}`;
  }
  function renderNav() {
    const r=route();
    mainNav.innerHTML=`<a href="#/" class="nav-item ${r.type==='home'?'active':''}"><span class="symbol">⌂</span> Главная<span class="end">↗</span></a><a href="#/semester/3" class="nav-item ${r.type==='semester'||r.type==='subject'||r.type==='pdf'?'active':''}"><span class="symbol">▦</span> Все предметы<span class="end">↗</span></a>`;
    semesterNav.innerHTML=Array.from({length:8},(_,i)=>{let n=i+1;return `<a href="#/semester/${n}" class="nav-item ${n===3&&r.type!=='home'?'active':''}"><span class="symbol">${n%2?'◈':'◇'}</span> ${n} семестр ${n===3?'<span class="end">●</span>':''}</a>`;}).join('');
  }
  function cleanupViewer() {
    viewerRun++;
    if(renderTask) { try{renderTask.cancel()}catch(_){} renderTask=null; }
    if(doc) {try{doc.destroy()}catch(_){} doc=null;}
  }
  function render() {
    cleanupViewer();
    renderNav();
    if(searchQuery.trim()){ renderSearch(); return; }
    const r=route();
    if(r.type==='home') renderHome();
    else if(r.type==='semester') renderSemester(r.number);
    else if(r.type==='subject') renderSubject(r.id);
    else if(r.type==='pdf') renderPdf(r.id,r.index);
    else renderHome();
  }
  view.addEventListener('click', e=>{
    const el=e.target.closest('button[data-href]');
    if(el && !el.disabled) location.hash=el.dataset.href;
  });
  searchInput.addEventListener('input',()=>{searchQuery=searchInput.value.trim();render();});
  window.addEventListener('hashchange',()=>{searchQuery=''; searchInput.value=''; render();window.scrollTo(0,0);});

  async function checkAvailability() {
    const entries=allLectures.map(({subject,lecture})=>fullPath(subject,lecture));
    for(const path of entries) availability[path]=null;
    render();
    await Promise.all(entries.map(async path=>{
      try {
        const response=await fetch(new URL(path,document.baseURI),{method:'HEAD',cache:'no-store'});
        availability[path]=response.ok;
      } catch(_) { availability[path]=null; }
      // Не перерисовывать сам PDF, если пользователь уже читает лекцию.
      if(route().type!=='pdf') render();
    }));
  }
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/';
  async function library() {
    if(!libPromise) libPromise=import(PDFJS+'pdf.min.mjs').then(lib=>{lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs'; return lib;});
    return libPromise;
  }
  function renderPdf(id, index) {
    const s=subjects.find(x=>x.id===id), l=s?.lectures[index-1];
    if(!s||!l) { view.innerHTML='<h1>Лекция не найдена</h1><a href="#/">На главную</a>';return; }
    currentSubject=s; currentLecture=l;pageNumber=1; viewerZoom=1;
    topCrumb.textContent=`3 семестр / ${s.title} / ${l.title}`;
    const url=fileUrl(s,l);
    view.innerHTML=`${breadcrumb([{label:'Главная',href:'#/'},{label:'3 семестр',href:'#/semester/3'},{label:s.title,href:'#/subject/'+s.id},{label:l.title}])}
    <div class="page-intro" style="margin-bottom:19px"><span class="eyebrow">▤ PDF · Лекция ${String(index).padStart(2,'0')}</span><h1 style="font-size:clamp(25px,3vw,35px)">${escapeHtml(l.title)}</h1></div>
    <div class="viewer-layout"><div class="viewer-toolbar"><div class="group"><button class="ghost-btn" id="prevPage" aria-label="Предыдущая страница">←</button><span id="pageCounter" class="page-counter">…</span><button class="ghost-btn" id="nextPage" aria-label="Следующая страница">→</button></div><div class="group"><button class="ghost-btn" id="zoomOut" aria-label="Уменьшить">−</button><span id="zoomLabel" class="page-counter">100%</span><button class="ghost-btn" id="zoomIn" aria-label="Увеличить">+</button><button class="ghost-btn" id="zoomReset" aria-label="По ширине">По ширине</button></div><div class="group"><a class="ghost-btn" target="_blank" rel="noopener" href="${escapeHtml(url)}">Оригинал ↗</a><a class="primary-btn" href="${escapeHtml(url)}" download>↓ PDF</a></div></div>
    <div class="pdf-stage" id="pdfStage"><div class="pdf-loading" id="pdfStatus">Загружаем PDF…</div><div class="pdf-center"><canvas id="pdfCanvas" aria-label="Страница PDF"></canvas></div></div></div>
    <div style="margin-top:20px" class="notice">При увеличении PDF перерисовывается в высоком разрешении. Для сравнения всегда можно открыть оригинал.</div>${footer()}`;
    const run=viewerRun;
    document.querySelector('#prevPage').addEventListener('click',()=>changePage(-1,run));
    document.querySelector('#nextPage').addEventListener('click',()=>changePage(1,run));
    document.querySelector('#zoomIn').addEventListener('click',()=>changeZoom(1.2,run));
    document.querySelector('#zoomOut').addEventListener('click',()=>changeZoom(1/1.2,run));
    document.querySelector('#zoomReset').addEventListener('click',()=>{viewerZoom=1; drawPage(run)});
    loadPdf(url,run);
  }
  async function loadPdf(url,run) {
    const status=document.querySelector('#pdfStatus');
    try {
      const pdfjs=await library();
      if(viewerRun!==run) return;
      const task=pdfjs.getDocument({url});
      const result=await task.promise;
      if(viewerRun!==run){await result.destroy();return;}
      doc=result;
      await drawPage(run);
    } catch(error) {
      if(viewerRun!==run) return;
      if(status) status.innerHTML=`<div class="pdf-error"><h3>Не удалось открыть PDF</h3><p>Проверь путь к файлу и подключение к интернету. Если PDF.js недоступен, можно открыть сам файл.</p><a class="primary-btn" target="_blank" rel="noopener" href="${escapeHtml(url)}">Открыть оригинальный PDF ↗</a></div>`;
      console.error('PDF.js:',error);
    }
  }
  async function changePage(delta, run){if(!doc||viewerRun!==run) return;pageNumber=Math.min(doc.numPages,Math.max(1,pageNumber+delta));await drawPage(run);}
  async function changeZoom(factor,run){if(!doc||viewerRun!==run)return;viewerZoom=Math.min(2.5,Math.max(.5,viewerZoom*factor));await drawPage(run);}
  async function drawPage(run) {
    if(!doc||viewerRun!==run)return;
    if(renderTask){try{renderTask.cancel()}catch(_){}renderTask=null;}
    const currentPage=pageNumber;
    try {
      const p=await doc.getPage(currentPage);
      if(viewerRun!==run||currentPage!==pageNumber) return;
      const canvas=document.querySelector('#pdfCanvas'), stage=document.querySelector('#pdfStage'), status=document.querySelector('#pdfStatus');
      if(!canvas||!stage)return;
      const natural=p.getViewport({scale:1});
      const width=Math.max(250,stage.clientWidth-42);
      const scale=(width/natural.width)*viewerZoom;
      const viewport=p.getViewport({scale});
      const dpr=Math.min(2.5,window.devicePixelRatio||1);
      canvas.width=Math.floor(viewport.width*dpr); canvas.height=Math.floor(viewport.height*dpr);
      canvas.style.width=viewport.width+'px'; canvas.style.height=viewport.height+'px';
      const context=canvas.getContext('2d');
      const task=p.render({canvasContext:context, viewport, transform:[dpr,0,0,dpr,0,0]});
      renderTask=task;
      await task.promise;
      if(renderTask===task)renderTask=null;
      if(viewerRun!==run)return;
      if(status)status.style.display='none';
      const counter=document.querySelector('#pageCounter'),zoom=document.querySelector('#zoomLabel');
      if(counter)counter.textContent=`${pageNumber} / ${doc.numPages}`;
      if(zoom)zoom.textContent=Math.round(viewerZoom*100)+'%';
      document.querySelector('#prevPage').disabled=pageNumber===1;
      document.querySelector('#nextPage').disabled=pageNumber===doc.numPages;
      stage.scrollTop=0;stage.scrollLeft=0;
    } catch(e) {if(e?.name!=='RenderingCancelledException')console.error('Render page:',e);}
  }
  window.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea'))return;
    if(route().type==='pdf'&&!e.ctrlKey&&!e.altKey){
      if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();changePage(1,viewerRun);}
      if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();changePage(-1,viewerRun);}
    }
  });
  let resizeTimer;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(route().type==='pdf'&&doc)drawPage(viewerRun)},170)});
  checkAvailability();
</script>
</body>
</html>
